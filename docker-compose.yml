services:
  ue-docker-nvidia:
    container_name: ue-docker-nvidia
    build: .
    image: ue-docker-nvidia
    network_mode: "host"
    environment:
    # Unreal Engine launcher with start parameters
    - RUN_ARGS=${RUN_ARGS}
    # Fix for proper NVIDIA driver version detection
    - DXVK_ENABLE_NVAPI=1
    # Selkies-Gstreamer    
    - TZ=UTC
    - DISPLAY_SIZEW=1920
    - DISPLAY_SIZEH=1080
    - DISPLAY_REFRESH=60
    - DISPLAY_DPI=96
    - DISPLAY_CDEPTH=24
    - PASSWD=mypasswd
    - SELKIES_ENCODER=nvh264enc
    - SELKIES_ENABLE_RESIZE=false
    - SELKIES_VIDEO_BITRATE=20000 # 20 Mbps
    - SELKIES_FRAMERATE=60
    - SELKIES_AUDIO_BITRATE=128000
    - SELKIES_ENABLE_BASIC_AUTH=false
    - SELKIES_ENABLE_HTTPS=false
    # General defaults
    - NVIDIA_VISIBLE_DEVICES=all
    - NVIDIA_DRIVER_CAPABILITIES=all
    ports:
      - "8080:8080" # Selkies
    tmpfs:
      - '/dev/shm:rw'
    stdin_open: true
    tty: true
    volumes:
      - ./app:/app:ro
      - ./wineprefix:/home/ubuntu/wineprefix
      - ./appdata:/home/ubuntu/wineprefix/drive_c/users/ubuntu/AppData
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]
    logging:
      driver: "json-file"
      options:
        max-size: "50m"

